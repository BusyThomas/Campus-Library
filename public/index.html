<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Campus Library</h1>
  <p class="sub">Authors and their books &mdash; data served by GraphQL</p>

  <div id="list">Loading&hellip;</div>

  <form id="addForm">
    <h3>Add a book</h3>
    <input id="title" placeholder="Book title" required>
    <input id="year" type="number" placeholder="Year" style="width:90px">
    <select id="authorId"></select>
    <button type="submit">Add book</button>
  </form>

  <script>
    const API = 'http://localhost:4000/';

    // escape text before putting it into innerHTML
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // helper: send a GraphQL query/mutation to the API
    async function gql(query, variables) {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables }),
      });
      const json = await res.json();
      if (json.errors) throw new Error(json.errors[0].message);
      return json.data;
    }

    // 1. READ: load all authors with their books
    async function load() {
      try {
        const data = await gql(`{ authors { id name country books { title year } } }`);

        document.getElementById('list').innerHTML = data.authors.map(a => `
          <div class="author-card">
            <h2>${esc(a.name)}</h2>
            <div class="country">${esc(a.country)}</div>
            ${a.books.map(b => `<div class="book">${esc(b.title)}${b.year ? ` <span class="yr">(${esc(b.year)})</span>` : ''}</div>`).join('')}
          </div>`).join('');

        // fill the author dropdown from the data (keeps the current selection)
        const sel = document.getElementById('authorId');
        const current = sel.value;
        sel.innerHTML = data.authors.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');
        if (current) sel.value = current;
      } catch (err) {
        document.getElementById('list').innerHTML =
          `<p class="error">Could not load data: ${esc(err.message)}</p>`;
      }
    }

    // 2. WRITE: add a book, then reload the list
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const yearRaw = document.getElementById('year').value;
      const year = yearRaw ? Number(yearRaw) : null;   // blank year -> NULL, not 0
      const authorId = document.getElementById('authorId').value;
      try {
        await gql(
          `mutation($t:String!,$y:Int,$a:ID!){ addBook(title:$t, year:$y, authorId:$a){ id } }`,
          { t: title, y: year, a: authorId }
        );
        e.target.reset();
        load();
      } catch (err) {
        alert('Could not add book: ' + err.message);
      }
    });

    load();
  </script>
</body>
</html>
